[project]
name = "fetchdown"
version = "0.1.0"
description = "Free web search + clean-markdown extraction for LLM agents (MCP server / library)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.15.0",
    "ddgs>=9.14.4",
    "mcp>=1.2.0",
    "pymupdf>=1.24.0",
    "trafilatura>=2.1.0",
]

[project.optional-dependencies]
http = ["flask>=3.1.3"]

[project.scripts]
fetchdown-mcp = "fetchdown.server:main"
fetchdown-http = "fetchdown.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fetchdown"]
